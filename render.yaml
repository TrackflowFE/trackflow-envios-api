services:
  - type: web
    name: trackflow-envios-api
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      # Todos estos valores se definen en el dashboard de Render, nunca en este archivo.
      - key: TRACKFLOW_DB_URL
        sync: false
      - key: TRACKFLOW_DB_USER
        sync: false
      - key: TRACKFLOW_DB_PASSWORD
        sync: false
      # La base es la de Supabase con plan gratuito: unas 15 conexiones para las tres APIs.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      # Las tres APIs deben usar el mismo broker y el mismo vhost, o los eventos no cruzan.
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_SSL
        value: "true"
      # Sin clave de operador la escritura queda abierta: definirla siempre aquí.
      - key: TRACKFLOW_OPERADOR_CLAVE
        sync: false
      # Sin esta clave, /api/admin/** queda inaccesible (cerrado por defecto).
      - key: TRACKFLOW_ADMIN_CLAVE
        sync: false
      # Tiene que ser idéntico en las tres APIs: solo esta emite los tokens y las otras dos los validan.
      - key: TRACKFLOW_JWT_SECRET
        sync: false
      # Dominio(s) del frontend, separados por comas. Sin él solo se admite localhost.
      - key: TRACKFLOW_CORS_ORIGINS
        sync: false
