spring.application.name=trackflow

# Render (y cualquier PaaS) inyecta el puerto por la variable PORT.
server.port=${PORT:8080}
# Render termina HTTPS en su proxy y reenvía por HTTP. Con esto la aplicación lee
# X-Forwarded-Proto y sabe que la petición original fue HTTPS (HU-08: el login solo
# viaja cifrado), lo que además activa la cabecera HSTS de Spring Security.
server.forward-headers-strategy=framework
trackflow.pickups.limite.ip=${TRACKFLOW_PICKUPS_LIMITE_IP:100}
trackflow.pickups.limite.recogida=${TRACKFLOW_PICKUPS_LIMITE_RECOGIDA:30}
trackflow.pickups.limite.recogida-por-ip=${TRACKFLOW_PICKUPS_LIMITE_RECOGIDA_POR_IP:5}
trackflow.pickups.limite.saltos-proxy=${TRACKFLOW_PICKUPS_LIMITE_SALTOS_PROXY:0}
trackflow.pickups.limite.proxies-confiables=${TRACKFLOW_PICKUPS_LIMITE_PROXIES_CONFIABLES:}
trackflow.pickups.limite.ventana-segundos=${TRACKFLOW_PICKUPS_LIMITE_VENTANA_SEGUNDOS:900}

# PQR (HU-19). Peticiones por IP en cada ventana a las dos rutas públicas: radicar y consultar.
trackflow.pqr.limite.radicar=${TRACKFLOW_PQR_LIMITE_RADICAR:5}
trackflow.pqr.limite.consultar=${TRACKFLOW_PQR_LIMITE_CONSULTAR:10}
trackflow.pqr.limite.ventana-segundos=${TRACKFLOW_PQR_LIMITE_VENTANA_SEGUNDOS:900}

spring.datasource.url=${TRACKFLOW_DB_URL:jdbc:postgresql://localhost:5432/trackflow}
spring.datasource.username=${TRACKFLOW_DB_USER:postgres}
spring.datasource.password=${TRACKFLOW_DB_PASSWORD:postgres}

# El esquema lo gobiernan las migraciones de Flyway; Hibernate solo verifica que
# las entidades coincidan con las tablas y nunca las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Las bases creadas antes de Flyway (por ddl-auto) se marcan como línea base en
# lugar de intentar recrear las tablas.
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Los brokers gestionados (CloudAMQP) dan un vhost propio; en local es "/".
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recogidas a domicilio (HU-20). El horario es configuración, no código: cambiarlo no
# exige recompilar. Los días van en número ISO (1 lunes ... 7 domingo) y las franjas
# en HH:MM-HH:MM separadas por comas. La anticipación mínima impide programar para
# dentro de un rato; el horizonte limita cuánto se puede agendar por adelantado.
trackflow.pickups.zona-horaria=${TRACKFLOW_PICKUPS_ZONA:America/Bogota}
trackflow.pickups.dias-operativos=${TRACKFLOW_PICKUPS_DIAS:1,2,3,4,5,6}
trackflow.pickups.franjas=${TRACKFLOW_PICKUPS_FRANJAS:08:00-10:00,10:00-12:00,12:00-14:00,14:00-16:00,16:00-18:00}
trackflow.pickups.anticipacion-minima-horas=${TRACKFLOW_PICKUPS_ANTICIPACION_HORAS:4}
trackflow.pickups.horizonte-maximo-dias=${TRACKFLOW_PICKUPS_HORIZONTE_DIAS:30}

# Credenciales del operador para las operaciones de escritura. Clave vacía = protección
# desactivada, que es lo adecuado en local pero nunca en un entorno expuesto a internet.
trackflow.security.operador-usuario=${TRACKFLOW_OPERADOR_USUARIO:operador}
trackflow.security.operador-clave=${TRACKFLOW_OPERADOR_CLAVE:}
# El supervisor solo consulta reportes; no registra ni modifica (HU-11).
trackflow.security.supervisor-usuario=${TRACKFLOW_SUPERVISOR_USUARIO:supervisor}
trackflow.security.supervisor-clave=${TRACKFLOW_SUPERVISOR_CLAVE:}
# El administrador puede además reconstruir proyecciones (/api/admin/**).
trackflow.security.admin-usuario=${TRACKFLOW_ADMIN_USUARIO:admin}
trackflow.security.admin-clave=${TRACKFLOW_ADMIN_CLAVE:}
# Correo de cada una de las tres cuentas, por donde recuperan su clave (HU-10). Sin
# correo, esa cuenta solo puede recuperarse pidiéndole el cambio al administrador. El
# entorno únicamente lo siembra: si luego se cambia por la API, manda el de la API.
trackflow.security.operador-email=${TRACKFLOW_OPERADOR_EMAIL:}
trackflow.security.supervisor-email=${TRACKFLOW_SUPERVISOR_EMAIL:}
trackflow.security.admin-email=${TRACKFLOW_ADMIN_EMAIL:}
# Bloqueo por intentos fallidos (HU-09): cuantos fallos, dentro de que plazo cuentan
# como seguidos, y cuanto dura el bloqueo si nadie lo levanta antes.
trackflow.security.intentos-antes-de-bloquear=${TRACKFLOW_INTENTOS_ANTES_DE_BLOQUEAR:5}
trackflow.security.ventana-intentos-minutos=${TRACKFLOW_VENTANA_INTENTOS_MINUTOS:15}
trackflow.security.bloqueo-minutos=${TRACKFLOW_BLOQUEO_MINUTOS:15}
trackflow.security.jwt-secret=${TRACKFLOW_JWT_SECRET:}

# Recuperación de contraseña (HU-10). El enlace apunta al frontend, que es quien pide
# la clave nueva; esta API solo valida el token. Vigencia en minutos.
trackflow.claves.recuperacion-minutos=${TRACKFLOW_RECUPERACION_MINUTOS:30}
trackflow.claves.url-restablecer=${TRACKFLOW_URL_RESTABLECER:http://localhost:5173/restablecer-clave.html}
trackflow.claves.remitente=${TRACKFLOW_CORREO_REMITENTE:no-responder@trackflow.app}

# Proveedor de correo. La API por HTTPS es la que funciona en el despliegue: la
# plataforma bloquea el trafico saliente a los puertos de SMTP (25, 465 y 587) para que
# nadie use sus servidores como fuente de correo basura, y los intentos no se rechazan,
# se descartan en silencio. Por el 443 no hay tal bloqueo.
trackflow.claves.api-url=${TRACKFLOW_CORREO_API_URL:https://api.brevo.com/v3/smtp/email}
trackflow.claves.api-clave=${TRACKFLOW_CORREO_API_CLAVE:}

# Servidor SMTP: la alternativa, util en local con un servidor de correo de pruebas. Sin host no se envía nada: el mensaje
# queda en la bitácora y el arranque lo advierte, que es lo razonable en local.
spring.mail.host=${TRACKFLOW_SMTP_HOST:}
spring.mail.port=${TRACKFLOW_SMTP_PUERTO:587}
spring.mail.username=${TRACKFLOW_SMTP_USUARIO:}
spring.mail.password=${TRACKFLOW_SMTP_CLAVE:}
# STARTTLS es lo que esperan Gmail y la mayoría de proveedores en el puerto 587.
spring.mail.properties.mail.smtp.auth=${TRACKFLOW_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${TRACKFLOW_SMTP_STARTTLS:true}
# Sin límite, un servidor de correo que no responde deja la conexión colgada hasta que
# el sistema operativo se rinde, minutos después. Diez segundos bastan para saber que
# no va a contestar.
spring.mail.properties.mail.smtp.connectiontimeout=${TRACKFLOW_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${TRACKFLOW_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${TRACKFLOW_SMTP_TIMEOUT_MS:10000}

# El estado del servidor de correo no decide si esta API está sana. Spring añade ese
# indicador en cuanto se configura spring.mail.host, y entonces cada consulta a
# /actuator/health abre una conexión al SMTP: si el proveedor tarda o el puerto está
# cerrado, la comprobación no responde y la plataforma da el despliegue por fallido,
# aunque la API esté atendiendo envíos con normalidad. Que no se pueda mandar un
# correo de recuperación es un problema, pero no es motivo para tumbar el servicio.
management.health.mail.enabled=false
# Vigencia máxima del token (una jornada) y cierre de la sesión tras un rato sin uso
# (HU-08): lo que pase primero.
trackflow.security.duracion-token-minutos=${TRACKFLOW_TOKEN_MINUTOS:480}
trackflow.security.inactividad-minutos=${TRACKFLOW_INACTIVIDAD_MINUTOS:30}

# Orígenes que pueden llamar a la API desde un navegador, separados por comas. Por
# defecto, los servidores de desarrollo locales; en Render, el dominio del frontend.
trackflow.cors.allowed-origins=${TRACKFLOW_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mvc.problemdetails.enabled=true
server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html

# Swagger queda público a propósito: Calidad y la sustentación prueban la API desde
# ahí. Se declara explícito porque, si no, SpringDoc avisa en cada arranque que está
# "habilitado por defecto"; con TRACKFLOW_SWAGGER_ENABLED=false se apaga sin tocar código.
springdoc.api-docs.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}

# HU-21. Chatbot de preguntas frecuentes. El umbral es qué tan parecido debe ser el
# mensaje a una pregunta para contestarla (entre 0 y 1; más alto = más exigente). Los
# límites protegen el servicio de quien envíe mensajes sin parar.
trackflow.chatbot.umbral=${TRACKFLOW_CHATBOT_UMBRAL:0.35}
trackflow.chatbot.limite.mensajes-por-minuto=${TRACKFLOW_CHATBOT_MENSAJES_POR_MINUTO:10}
trackflow.chatbot.limite.mensajes-por-ip=${TRACKFLOW_CHATBOT_MENSAJES_POR_IP:60}
trackflow.chatbot.limite.sesiones-por-ip=${TRACKFLOW_CHATBOT_SESIONES_POR_IP:10}
trackflow.chatbot.limite.ventana-segundos=${TRACKFLOW_CHATBOT_VENTANA_SEGUNDOS:60}

# Observabilidad (Prometheus). Por defecto solo /actuator/health está expuesto, que es lo que
# necesita Render. En Kubernetes se activan las métricas con variables de entorno, sin tocar
# este archivo: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus y
# MANAGEMENT_SERVER_PORT=8081. El puerto 8081 no se publica fuera del clúster.
management.metrics.tags.application=trackflow-envios-api
