# API 1 - Envíos (trackflow-envios-api). Aparece en http://localhost:8080

# Quien la despliega: el responsable de la API de envíos (API 1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-envios
  namespace: trackflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-envios }
  template:
    metadata:
      labels: { app: api-envios }
    spec:
      containers:
        - name: api-envios
          image: trackflow-envios-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: gestion, containerPort: 8081 }
          env:
            - name: TRACKFLOW_DB_URL
              value: "jdbc:postgresql://postgres:5432/trackflow"
            - name: TRACKFLOW_DB_USER
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: db-user }
            - name: TRACKFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: db-password }
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_SSL
              value: "false"
            - name: RABBITMQ_VHOST
              value: "/"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: rabbit-user }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: rabbit-password }
            - name: TRACKFLOW_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: jwt-secret }
            - name: TRACKFLOW_CORS_ORIGINS
              value: "http://localhost:5173"
            - name: PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus"
            - name: TRACKFLOW_OPERADOR_CLAVE
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: operador-clave }
            - name: TRACKFLOW_SUPERVISOR_CLAVE
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: supervisor-clave }
            - name: TRACKFLOW_ADMIN_CLAVE
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: admin-clave }
          startupProbe:
            httpGet: { path: /actuator/health, port: gestion }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: gestion }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health, port: gestion }
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
---
# Interno: lo usan Prometheus (puerto 8081) y las otras APIs. No sale del clúster.
apiVersion: v1
kind: Service
metadata:
  name: api-envios
  namespace: trackflow
spec:
  selector: { app: api-envios }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: gestion, port: 8081, targetPort: gestion }
---
# Público: publica SOLO el puerto 8080, nunca el de gestión (las métricas).
apiVersion: v1
kind: Service
metadata:
  name: api-envios-publico
  namespace: trackflow
spec:
  type: NodePort
  selector: { app: api-envios }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30080 }
