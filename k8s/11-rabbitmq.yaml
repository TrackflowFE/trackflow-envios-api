# Broker compartido: las tres APIs deben usar el mismo broker y el mismo vhost, o los eventos no cruzan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: trackflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: consola, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: rabbit-user }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: rabbit-password }
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: trackflow
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: consola, port: 15672, targetPort: 15672 }
---
# Solo para abrir la consola de RabbitMQ desde tu navegador (http://localhost:15672).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-consola
  namespace: trackflow
spec:
  type: NodePort
  selector: { app: rabbitmq }
  ports:
    - { port: 15672, targetPort: 15672, nodePort: 31567 }
