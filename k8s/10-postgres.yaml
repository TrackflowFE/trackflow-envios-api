# Base de datos compartida por las tres APIs (en producción es Supabase; aquí un Postgres local).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-datos
  namespace: trackflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: trackflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: trackflow
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: db-user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: trackflow-secretos, key: db-password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d trackflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: postgres-datos
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trackflow
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
